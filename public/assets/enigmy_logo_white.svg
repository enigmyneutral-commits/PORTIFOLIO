<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%" fill="none">
  <!-- Top sweeping arch -->
  <path 
    d="M 68 68 C 96 32, 195 24, 264 54" 
    stroke="#F5F7F4" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    opacity="0.85"
  />
  
  <!-- Bottom left orbital curve -->
  <path 
    d="M 52 88 C 36 94, 34 116, 74 128" 
    stroke="#F5F7F4" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    opacity="0.85"
  />

  <!-- ENIGMY text -->
  <text 
    x="160" 
    y="86" 
    text-anchor="middle" 
    fill="#FFFFFF" 
    font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="800" 
    font-size="44" 
    letter-spacing="4"
  >
    ENIGMY
  </text>

  <!-- NEUTRAL text -->
  <text 
    x="160" 
    y="120" 
    text-anchor="middle" 
    fill="#F5F7F4" 
    font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="600" 
    font-size="22" 
    letter-spacing="9"
  >
    NEUTRAL
  </text>
</svg>
